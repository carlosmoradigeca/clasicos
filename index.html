<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clásicos Costa Rica Español</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-transform: uppercase;
        }
        .slogan {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        /* Contenedor del reproductor de EverestCast */
        .player-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puedes cambiar el texto o poner la etiqueta de una imagen si tienes logo -->
        <div class="logo">Tu Emisora Online</div>
        <div class="slogan">Transmitiendo en vivo para ti 24/7</div>

        <!-- PEGA TU CÓDIGO DE EVERESTCAST AQUÍ ABAJO -->
        <div class="player-box">
            <!-- Ejemplo: <iframe src="TU_ENLACE_DE_EVERESTCAST" width="100%" height="100" frameborder="0"></iframe> -->
            <p style="color: #94a3b8; font-size: 14px;">https://phoebe.streamerr.co:2140/;?type=http&nocache=1785807782</p>
        </div>
    </div>

    <footer>
        &copy; 2026 - Todos los derechos reservados
    </div>

</body>
</html>
