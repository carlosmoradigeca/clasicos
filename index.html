<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clásicos Costa Rica Español</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-transform: uppercase;
        }
        .slogan {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        /* Contenedor del reproductor de EverestCast */
        .player-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puedes cambiar el texto o poner la etiqueta de una imagen si tienes logo -->
        <div class="logo">Tu Emisora Online</div>
        <div class="slogan">Transmitiendo en vivo para ti 24/7</div>

        <!-- PEGA TU CÓDIGO DE EVERESTCAST AQUÍ ABAJO -->
        <div class="player-box">
            <!-- Ejemplo: <iframe src="TU_ENLACE_DE_EVERESTCAST" width="100%" height="1200" frameborder="0"></iframe> -->
            <p style="color: #94a3b8; font-size: 14px;"><div style="width: 400px;"  id="sc-player">
<div
is="player"
lang="en" 
api-url="https://phoebe.streamerr.co:1730/api/v2"
server-id="1"
station-name="Clásicos de Costa Rica"
station-url="https://clasicosdecostarica.blogspot.com"
imagecontainer="left"
imagecontainer-bg="#78a3b5"
imagecontainer-bg-opacity="1"
controlscontainer="right"
controlscontainer-bg="#d6d6d6"
controlscontainer-bg-opacity="1"
controlscontainer-bg-img="https://phoebe.streamerr.co:1730/media/player_bg/player_bg.jpg"
historycontainer="bottom"
historycontainer-bg="#cdd8e5"
historycontainer-bg-opacity="1"
:show-history="true"
history-limit="15"
sharecontainer="both"
sharecontainer-bg="#ffffff"
sharecontainer-bg-opacity="1"
:show-share="false"
share-url=""
:share="['facebook','telegram','twitter']"
:show-dj="false"
default-dj-img="https://phoebe.streamerr.co:1730/media/djs/dj.png"
:show-image="true"
default-cover-image="https://phoebe.streamerr.co:1730/media/widgets/logo_nuevo_bS9eU9D.png"
play-button-color="#35495e"
play-button-bg="null"
visualizer-outline-color="#37679a"
visualizer-bar-width="1"
:channels-displayed="[]"
channels-switch-bg="#4165b9"
channels-switch-color="#ffffff"
channels-switch-bg-active="#dddddd"
channels-switch-color-active="#000000"
:show-vote="true"
vote-buttons-color="#35495e"
vote-buttons-opacity="1"
vote-results-font-color="#FFFFFF"
vote-results-font-size="10"
:progress-show="true"
progress-bar-color="#35495e"
progress-bar-bg-color="#41b883"
progress-bar-bg-opacity="0.1"
progress-bar-bg-height="25"
progress-bar-opacity="1"
progress-font-color="#FFFFFF"
progress-font-size="12"
progress-bar-bg-radius="10"
progress-bar-bg-border="#F5F5F5"
player-width="400px"
>
</div>
</div>
<script type="text/javascript" src="https://phoebe.streamerr.co:1730/media/static/js/sc_player/sc_player.js"></script></p>
        </div>
    </div>

    <footer>
        &copy; 2026 - Todos los derechos reservados
    </div>

</body>
</html>
